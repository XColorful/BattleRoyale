plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    from(project(':core').sourceSets.main.resources)

    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            loader_version_range   : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_credits            : mod_credits,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_issue_url          : mod_issue_url,
            mod_display_url        : mod_display_url,
            mod_logo_file          : mod_logo_file,
            pack_description       : pack_description,
            pack_format            : pack_format,

            target_modloader       : forge_id,
            target_version_range   : forge_version_range,

            journeymap_version_range: journeymap_version_range,
            playerrevive_version_range: playerrevive_version_range,
            tacz_version_range      : tacz_version_range,
            cbraddon_version_range  : cbraddon_version_range,
            armorscaling_version_range: armorscaling_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// JourneyMap 6.x把API 2.0以JiJ形式打包在mod jar的META-INF/jarjar下，且未发布1.20.1版本
// （maven上的journeymap-api-forge均为Java 21构建，本分支编译目标是Java 17）
// 因此从已解析的mod jar中解出API jar作为compileOnly，保证编译期与运行时同源
configurations {
    journeymapMod {
        canBeConsumed = false
    }
}

def jmApiDir = layout.buildDirectory.dir('journeymap-api')

def extractJourneyMapApi = tasks.register('extractJourneyMapApi', Copy) {
    from({ zipTree(configurations.journeymapMod.singleFile) }) {
        include 'META-INF/jarjar/journeymap-api-forge-*.jar'
        eachFile { it.relativePath = new RelativePath(true, 'journeymap-api-forge.jar') }
        includeEmptyDirs = false
    }
    into jmApiDir
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation project(":core")

    journeymapMod journeymap_curse_maven
    compileOnly files(jmApiDir.map { it.file('journeymap-api-forge.jar') })
    runtimeOnly fg.deobf(journeymap_curse_maven)
    compileOnly fg.deobf(tacz_curse_maven)
}

tasks.withType(JavaCompile).configureEach {
    dependsOn extractJourneyMapApi
}

tasks.named('jar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveVersion.set(mod_version)
    archiveClassifier.set("${forge_id}-${minecraft_version}")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':core').sourceSets.main.output
}

tasks.matching { it.name == 'remapJar' || it.name == 'reobfJar' }.configureEach {
    if (it.hasProperty("archiveClassifier")) {
        it.archiveBaseName.set(mod_id)
        it.archiveVersion.set(mod_version)
        it.archiveClassifier.set("${forge_id}-${minecraft_version}")
    }
}