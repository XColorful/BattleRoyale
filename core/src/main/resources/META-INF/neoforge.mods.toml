modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_display_url}"
logoFile="${mod_logo_file}"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="${target_modloader}"
type="required"
versionRange="${target_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId = "journeymap"
type="optional"
versionRange = "${journeymap_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId="playerrevive"
type="optional"
versionRange="${playerrevive_version_range}"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
type="optional"
versionRange="${tacz_version_range}"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cbraddon"
type="optional"
versionRange="${cbraddon_version_range}"
side="SERVER"